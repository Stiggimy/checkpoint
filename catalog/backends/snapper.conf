SCHEMA_VERSION=2
BACKEND_ID=snapper
NAME="Snapper"
EMOJI=📸
STORAGE_FORMAT=btrfs
CAP_BOOTABLE_SUBVOL=true
CAP_PAIRED_PRE_POST=true

REQUIRES_CMD=snapper
PROBE_ACTIVE_CMD="command -v snapper >/dev/null 2>&1 && { [[ -e /etc/snapper/configs/root ]] || { command -v sudo >/dev/null 2>&1 && sudo -n snapper -c root get-config >/dev/null 2>&1; }; }"
PRIORITY=20

CREATE_CMD='sudo snapper -c root create --description "$COMMENT" --print-number ${SNAP_TYPE:+--type "$SNAP_TYPE"} ${PRE_ID:+--pre-number "$PRE_ID"}'
PRE_CREATE_CMD=''
EXTRACT_ID_REGEX='^[0-9]+$'
SUBVOL_PATH_TEMPLATE='${ROOT_SUBVOL}/.snapshots/${SNAPSHOT_ID}/snapshot'
LIST_CMD='sudo snapper -c root list --columns number,description'
DELETE_CMD='sudo snapper -c root delete "$SNAPSHOT"'

LIST_PARSER='awk -F"|" "NR>2 { num=\$1; desc=\$2; gsub(/^[ \\t]+|[ \\t]+\$/, \"\", num); gsub(/^[ \\t]+|[ \\t]+\$/, \"\", desc); if (num ~ /^[0-9]+$/ && num != \"0\") { if (!desc) desc=\"(no description)\"; print num \" | \" desc; } }"'
